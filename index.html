<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5f7f">
<title>kWen’s Cookbook</title>
<style>
:root {
  --bg: #fff7ea;
  --bg2: #f3eadf;
  --card: rgba(255,255,255,.92);
  --ink: #241b15;
  --muted: #766454;
  --line: #ead7c2;
  --accent: #b65f2e;
  --accent-dark: #8c431d;
  --blue: #2f5f7f;
  --gold: #f2c14e;
  --shadow: 0 12px 32px rgba(63, 38, 18, .14);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: var(--ink);
  background:
    radial-gradient(circle at top left, rgba(242,193,78,.38), transparent 34rem),
    radial-gradient(circle at top right, rgba(47,95,127,.16), transparent 28rem),
    linear-gradient(160deg, var(--bg), var(--bg2));
  min-height: 100vh;
}
header {
  position: sticky;
  top: 0;
  z-index: 20;
  padding: calc(12px + env(safe-area-inset-top)) 14px 12px;
  background: rgba(255,247,234,.9);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(234,215,194,.8);
}
.wrap { max-width: 1000px; margin: 0 auto; }
.brand {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  margin-bottom: 10px;
}
h1 {
  margin: 0;
  font-size: 1.72rem;
  letter-spacing: -.045em;
  line-height: 1.05;
}
.subtitle {
  margin: 3px 0 0;
  color: var(--muted);
  font-size: .92rem;
}
.pill {
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(255,255,255,.7);
  padding: 7px 10px;
  font-size: .82rem;
  color: var(--muted);
  white-space: nowrap;
}
.searchrow { display:flex; gap: 8px; }
.search {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 13px 14px;
  font-size: 1rem;
  background: rgba(255,255,255,.95);
  color: var(--ink);
  outline: none;
  box-shadow: 0 2px 0 rgba(255,255,255,.6) inset;
}
.clearbtn {
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 0 12px;
  background: white;
  font-weight: 800;
  color: var(--muted);
}
main {
  padding: 13px 14px 44px;
}
.toolbar {
  max-width: 1000px;
  margin: 0 auto;
}
.chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 0 12px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.chips::-webkit-scrollbar { display:none; }
.chip {
  border: 1px solid var(--line);
  background: rgba(255,255,255,.88);
  color: var(--ink);
  border-radius: 999px;
  padding: 9px 12px;
  white-space: nowrap;
  font-weight: 750;
  box-shadow: 0 3px 12px rgba(63,38,18,.06);
}
.chip.active {
  background: var(--blue);
  color: white;
  border-color: var(--blue);
}
.subtoolbar {
  display:flex; align-items:center; justify-content:space-between; gap: 10px;
  margin: 0 0 12px;
  color: var(--muted);
  font-size: .92rem;
}
.toggle {
  display:flex; align-items:center; gap: 7px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,.82);
  border-radius: 999px;
  padding: 8px 11px;
  color: var(--ink);
  font-weight: 750;
}
.grid {
  max-width: 1000px;
  margin: 0 auto;
  display: grid;
  gap: 12px;
}
.card {
  border: 1px solid rgba(234,215,194,.92);
  background: var(--card);
  border-radius: 22px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.cardtop {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px;
  align-items: start;
  padding: 15px 15px 12px;
}
.openbtn {
  appearance: none;
  border: 0;
  background: transparent;
  text-align: left;
  padding: 0;
  color: var(--ink);
}
.title {
  font-size: 1.08rem;
  font-weight: 900;
  letter-spacing: -.018em;
  line-height: 1.2;
}
.meta {
  margin-top: 7px;
  color: var(--muted);
  font-size: .88rem;
  line-height: 1.35;
}
.badge {
  display:inline-flex;
  margin-top: 9px;
  font-size: .75rem;
  color: white;
  background: var(--accent);
  border-radius: 999px;
  padding: 4px 8px;
  font-weight: 750;
}
.fav {
  width: 42px; height: 42px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,.9);
  border-radius: 15px;
  font-size: 1.25rem;
  line-height: 1;
}
.fav.on {
  background: #fff2bf;
  border-color: #e4bd43;
}
.panel {
  display: none;
  padding: 0 15px 16px;
  border-top: 1px dashed var(--line);
}
.card.open .panel { display:block; }
.section-title {
  margin: 15px 0 8px;
  font-size: .94rem;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--blue);
}
ul, ol {
  padding-left: 22px;
  margin-top: 8px;
}
li {
  margin: 7px 0;
  line-height: 1.39;
}
.notes {
  background: #fff4df;
  border: 1px solid #ecd0a0;
  border-radius: 16px;
  padding: 12px;
  margin-top: 14px;
  color: #543a20;
  line-height: 1.38;
}
.empty {
  text-align: center;
  color: var(--muted);
  padding: 44px 12px;
  border: 1px dashed var(--line);
  border-radius: 22px;
  background: rgba(255,255,255,.55);
}
.footer {
  max-width: 1000px;
  margin: 0 auto;
  color: var(--muted);
  text-align:center;
  font-size: .82rem;
  padding: 24px 8px;
}
@media (min-width: 760px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  h1 { font-size: 2.1rem; }
}
@media print {
  header, .toolbar, .footer, .fav { display: none; }
  body { background:white; }
  main { padding:0; }
  .grid { display:block; }
  .card { box-shadow:none; break-inside:avoid; margin-bottom:16px; border-color:#ddd; }
  .panel { display:block; }
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">
      <div>
        <h1>kWen’s Cookbook</h1>
        <p class="subtitle">Searchable, favorite-able, kitchen-chaos friendly.</p>
      </div>
      <div class="pill" id="totalPill"></div>
    </div>
    <div class="searchrow">
      <input id="search" class="search" placeholder="Search recipes or ingredients..." autocomplete="off">
      <button class="clearbtn" onclick="clearSearch()" aria-label="Clear search">×</button>
    </div>
  </div>
</header>

<main>
  <div class="toolbar">
    <div id="chips" class="chips"></div>
    <div class="subtoolbar">
      <div id="count"></div>
      <button class="toggle" id="favToggle" onclick="toggleFavorites()">⭐ Favorites</button>
    </div>
  </div>
  <section id="grid" class="grid"></section>
  <div class="footer">Tip: use Safari → Share → Add to Home Screen. Favorites save on this device.</div>
</main>

const grid = document.getElementById('grid');
const search = document.getElementById('search');
const chips = document.getElementById('chips');
const count = document.getElementById('count');
const totalPill = document.getElementById('totalPill');
const favToggle = document.getElementById('favToggle');

let activeCategory = 'All';
let showFavorites = false;
const favKey = 'kwensCookbookFavoritesV2';
let favorites = JSON.parse(localStorage.getItem(favKey) || '[]');

const categories = ['All', 'Favorites', ...Array.from(new Set(recipes.map(r => r.category))).sort()];

function slug(s) {
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
}

function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, m => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;'
  }[m]));
}

function saveFavs() {
  localStorage.setItem(favKey, JSON.stringify(favorites));
}

function isFav(title) {
  return favorites.includes(title);
}

function toggleFav(title, event) {
  event.stopPropagation();
  if (isFav(title)) favorites = favorites.filter(x => x !== title);
  else favorites.push(title);
  saveFavs();
  renderRecipes();
}

function setCategory(cat) {
  activeCategory = cat;
  showFavorites = cat === 'Favorites';
  renderChips();
  renderRecipes();
}

function toggleFavorites() {
  showFavorites = !showFavorites;
  activeCategory = showFavorites ? 'Favorites' : 'All';
  renderChips();
  renderRecipes();
}

function clearSearch() {
  search.value = '';
  renderRecipes();
  search.focus();
}

function recipeMatches(recipe, query) {
  const blob = [
    recipe.title,
    recipe.category,
    recipe.yield,
    recipe.notes,
    ...(recipe.tags || []),
    ...(recipe.ingredients || []),
    ...(recipe.method || [])
  ].join(' ').toLowerCase();
  return blob.includes(query.toLowerCase());
}

function renderChips() {
  chips.innerHTML = categories.map(cat => `
    <button class="chip ${cat === activeCategory ? 'active' : ''}" onclick="setCategory(${JSON.stringify(cat)})">
      ${escapeHtml(cat)}
    </button>
  `).join('');
}

function renderRecipes() {
  const q = search.value.trim();
  let filtered = recipes.slice();

  if (activeCategory === 'Favorites' || showFavorites) {
    filtered = filtered.filter(r => isFav(r.title));
  } else if (activeCategory !== 'All') {
    filtered = filtered.filter(r => r.category === activeCategory);
  }

  if (q) filtered = filtered.filter(r => recipeMatches(r, q));

  filtered.sort((a,b) => a.title.localeCompare(b.title));

  totalPill.textContent = `${recipes.length} recipes`;
  count.textContent = `${filtered.length} shown`;
  favToggle.classList.toggle('active', showFavorites);

  if (!filtered.length) {
    grid.innerHTML = `<div class="empty">No recipes found. Try another search, or clear the Favorites filter.</div>`;
    return;
  }

  grid.innerHTML = filtered.map((r) => `
    <article class="card" id="${slug(r.title)}">
      <div class="cardtop">
        <button class="openbtn" onclick="this.closest('.card').classList.toggle('open')">
          <div class="title">${escapeHtml(r.title)}</div>
          <div class="meta">${escapeHtml(r.yield || '')}${r.tags?.length ? ' · ' + r.tags.map(escapeHtml).join(', ') : ''}</div>
          <span class="badge">${escapeHtml(r.category)}</span>
        </button>
        <button class="fav ${isFav(r.title) ? 'on' : ''}" onclick="toggleFav(${JSON.stringify(r.title)}, event)" aria-label="Favorite">
          ${isFav(r.title) ? '★' : '☆'}
        </button>
      </div>
      <div class="panel">
        <div class="section-title">Ingredients</div>
        <ul>${(r.ingredients || []).map(x => `<li>${escapeHtml(x)}</li>`).join('')}</ul>
        <div class="section-title">Method</div>
        <ol>${(r.method || []).map(x => `<li>${escapeHtml(x)}</li>`).join('')}</ol>
        ${r.notes ? `<div class="notes"><strong>Notes:</strong> ${escapeHtml(r.notes)}</div>` : ''}
      </div>
    </article>
  `).join('');
}

search.addEventListener('input', renderRecipes);
renderChips();
renderRecipes();
</script>
