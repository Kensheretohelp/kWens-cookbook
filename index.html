<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kWen’s Cookbook</title>
<style>
:root {
  --teal:#9fc7bd;
  --teal-dark:#0b4a57;
  --teal-ink:#053746;
  --cream:#f5e4c3;
  --paper:#fff3d4;
  --paper2:#f8e8c7;
  --rust:#b44422;
  --rust-dark:#8f321c;
  --mustard:#dca10f;
  --ink:#053746;
  --muted:#6d6658;
  --line:rgba(5,55,70,.22);
  --shadow:0 18px 38px rgba(24,32,26,.18);
}
* { box-sizing:border-box; }
body {
  margin:0;
  min-height:100vh;
  color:var(--ink);
  font-family: Georgia, "Times New Roman", serif;
  background:
    radial-gradient(circle at 20% 0%, rgba(220,161,15,.20), transparent 24rem),
    radial-gradient(circle at 80% 0%, rgba(159,199,189,.34), transparent 24rem),
    linear-gradient(180deg, #f2d9aa 0%, var(--cream) 38%, #ead0a4 100%);
}
body::before {
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.22;
  background-image:
    linear-gradient(rgba(5,55,70,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(5,55,70,.035) 1px, transparent 1px);
  background-size:34px 34px;
}
button, input { font:inherit; }
.app {
  min-height:100vh;
  display:grid;
  grid-template-columns:292px minmax(0,1fr);
}
.sidebar {
  position:sticky;
  top:0;
  height:100vh;
  overflow:auto;
  padding:24px 22px;
  background:linear-gradient(180deg, rgba(255,255,255,.12), transparent 36%), var(--teal);
  border-right:2px solid rgba(5,55,70,.24);
  box-shadow:8px 0 30px rgba(5,55,70,.08);
}
.brand {
  text-align:center;
  padding-bottom:18px;
  border-bottom:1px solid rgba(5,55,70,.28);
  margin-bottom:16px;
}
.logo-title {
  margin:0;
  color:var(--teal-dark);
  font-size:3rem;
  line-height:.9;
  letter-spacing:-.07em;
  font-weight:900;
}
.logo-sub {
  margin:10px 0 0;
  color:var(--rust);
  font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;
  font-size:.86rem;
  font-weight:800;
  letter-spacing:.42em;
  text-transform:uppercase;
}
.brand small {
  display:block;
  margin-top:12px;
  color:var(--teal-ink);
  font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;
  font-weight:800;
  letter-spacing:.16em;
  text-transform:uppercase;
}
.hat-svg { width:172px; max-width:100%; margin:0 auto 10px; display:block; }
.nav-section {
  border-bottom:1px solid rgba(5,55,70,.25);
  padding:8px 0 12px;
  margin-bottom:8px;
}
.nav-label {
  margin:10px 0 8px;
  color:var(--rust);
  font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;
  font-size:.74rem;
  font-weight:900;
  letter-spacing:.18em;
  text-transform:uppercase;
}
.nav-item,.cat-head,.recipe-link {
  width:100%;
  border:0;
  background:transparent;
  color:var(--teal-ink);
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 8px;
  border-radius:10px;
  cursor:pointer;
  text-align:left;
  font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;
  font-weight:850;
  letter-spacing:.07em;
  text-transform:uppercase;
  font-size:.86rem;
}
.nav-item:hover,.cat-head:hover,.recipe-link:hover { background:rgba(255,255,255,.22); }
.cat-head.active {
  background:var(--mustard);
  color:var(--teal-ink);
  box-shadow:inset 0 -2px rgba(120,79,0,.18);
}
.cat-head .chev { margin-left:auto; transition:transform .2s ease; }
.cat.open .chev { transform:rotate(90deg); }
.recipe-list { display:none; padding:2px 0 5px 28px; }
.cat.open .recipe-list { display:block; }
.recipe-link {
  text-transform:none;
  letter-spacing:0;
  font-family:Georgia,"Times New Roman",serif;
  font-weight:700;
  font-size:.92rem;
  padding:7px 8px;
  color:rgba(5,55,70,.88);
}
.recipe-link.active { color:var(--rust-dark); background:rgba(255,243,212,.48); }
.main {
  min-width:0;
  display:grid;
  grid-template-columns:minmax(0,1fr) 410px;
  min-height:100vh;
}
.content {
  padding:0 26px 34px;
  border-right:2px solid rgba(5,55,70,.14);
  position:relative;
}
.topbar {
  position:sticky;
  top:0;
  z-index:20;
  display:grid;
  grid-template-columns:auto 1fr minmax(220px,380px);
  align-items:center;
  gap:18px;
  padding:24px 0 16px;
  background:linear-gradient(to bottom, rgba(245,228,195,.98) 75%, rgba(245,228,195,0));
}
.menu-toggle {
  width:46px;
  height:46px;
  border:0;
  background:transparent;
  color:var(--rust);
  display:none;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
.tagline {
  justify-self:center;
  color:var(--teal-ink);
  font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;
  font-size:.86rem;
  font-weight:900;
  letter-spacing:.32em;
  text-transform:uppercase;
}
.search-wrap { position:relative; }
.searchbox {
  width:100%;
  border:2px solid rgba(5,55,70,.65);
  border-radius:999px;
  padding:13px 46px 13px 18px;
  background:rgba(255,243,212,.78);
  color:var(--ink);
  outline:none;
  font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;
}
.search-icon {
  position:absolute;
  right:16px;
  top:50%;
  transform:translateY(-50%);
  color:var(--rust);
  font-size:1.4rem;
}
.hero {
  position:relative;
  padding:26px 6px 10px;
  min-height:120px;
}
.hero h1 {
  margin:0;
  color:var(--rust);
  font-family:Impact, Haettenschweiler, "Arial Narrow Bold", ui-sans-serif, sans-serif;
  font-size:clamp(2.3rem,5vw,4.1rem);
  line-height:.95;
  letter-spacing:.08em;
  text-transform:uppercase;
  font-weight:900;
}
.hero p {
  max-width:500px;
  margin:10px 0 0;
  font-size:1.16rem;
  color:var(--teal-ink);
  font-weight:700;
}
.hero::after {
  content:"";
  display:block;
  width:min(360px,70%);
  border-bottom:2px dashed rgba(180,68,34,.55);
  margin-top:10px;
}
.hero-pot {
  position:absolute;
  right:18px;
  top:20px;
  opacity:.92;
}
.card-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(210px, 1fr));
  gap:16px;
  padding:12px 0 158px;
}
.recipe-card {
  border:1.8px solid rgba(5,55,70,.24);
  border-radius:14px;
  background:rgba(255,243,212,.78);
  overflow:hidden;
  box-shadow:0 10px 18px rgba(5,55,70,.10);
  cursor:pointer;
  transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
}
.recipe-card:hover {
  transform:translateY(-3px);
  box-shadow:0 16px 26px rgba(5,55,70,.16);
}
.recipe-card.active {
  border-color:var(--rust);
  box-shadow:0 0 0 3px rgba(180,68,34,.16), 0 16px 26px rgba(5,55,70,.15);
}
.thumb {
  height:126px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  border-bottom:1px solid rgba(5,55,70,.18);
  background:radial-gradient(circle at 25% 25%, rgba(255,255,255,.35), transparent 9rem), linear-gradient(135deg, rgba(220,161,15,.55), rgba(180,68,34,.35)), var(--paper);
}
.thumb svg { width:88px; height:88px; filter:drop-shadow(0 4px 6px rgba(0,0,0,.12)); }
.heart {
  position:absolute;
  top:8px;
  right:8px;
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  border:1px solid rgba(180,68,34,.34);
  border-radius:9px;
  background:rgba(255,243,212,.85);
  color:var(--rust);
  font-size:1.2rem;
}
.heart.faved { background:var(--rust); color:var(--paper); }
.card-body { padding:12px 14px 13px; }
.card-body h2 {
  min-height:52px;
  margin:0 0 10px;
  font-size:1.18rem;
  line-height:1.12;
  color:var(--teal-ink);
  text-align:center;
}
.card-foot {
  border-top:1px solid rgba(5,55,70,.18);
  padding-top:9px;
  display:flex;
  gap:8px;
  align-items:center;
  color:var(--teal-dark);
  font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;
  font-weight:900;
  letter-spacing:.08em;
  text-transform:uppercase;
  font-size:.72rem;
}
.wagon-wrap {
  position:fixed;
  left:318px;
  bottom:18px;
  z-index:1;
  pointer-events:none;
  display:flex;
  align-items:flex-end;
  gap:24px;
  opacity:.95;
}
.quote {
  font-family:"Brush Script MT","Segoe Script",cursive;
  color:var(--teal-dark);
  font-size:1.9rem;
  line-height:1;
  text-shadow:0 1px rgba(255,255,255,.5);
}
.quote small {
  display:block;
  margin-top:8px;
  color:var(--rust);
  font-family:Georgia,"Times New Roman",serif;
  font-size:1rem;
}
.detail {
  position:sticky;
  top:0;
  height:100vh;
  overflow:auto;
  padding:30px 22px;
  background:rgba(255,243,212,.42);
}
.detail-card {
  background:rgba(255,243,212,.86);
  border:1.8px solid rgba(5,55,70,.22);
  border-radius:18px;
  overflow:hidden;
  box-shadow:var(--shadow);
}
.detail-head {
  background:linear-gradient(180deg, var(--rust), var(--rust-dark));
  color:var(--paper);
  padding:20px 22px;
  display:flex;
  gap:12px;
  justify-content:space-between;
}
.detail-title {
  margin:0;
  font-size:1.7rem;
  line-height:1.05;
}
.close-detail,.fav-detail {
  border:0;
  background:transparent;
  color:var(--paper);
  font-size:1.55rem;
  cursor:pointer;
}
.detail-hero {
  min-height:190px;
  display:grid;
  place-items:center;
  background:radial-gradient(circle at center, rgba(255,255,255,.25), transparent 8rem), linear-gradient(135deg, rgba(5,55,70,.24), rgba(220,161,15,.34)), var(--paper2);
  border-bottom:1px solid rgba(5,55,70,.16);
}
.detail-hero svg { width:138px; height:138px; }
.info-row {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  border-bottom:1px solid rgba(5,55,70,.18);
}
.info {
  padding:14px 10px;
  text-align:center;
  border-right:1px solid rgba(5,55,70,.18);
  font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;
  font-weight:900;
  text-transform:uppercase;
  font-size:.74rem;
  letter-spacing:.08em;
}
.info:last-child { border-right:0; }
.tags {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  padding:14px 18px 0;
}
.tag {
  border:1px solid rgba(5,55,70,.22);
  background:rgba(159,199,189,.25);
  border-radius:999px;
  padding:5px 9px;
  font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;
  font-size:.75rem;
  font-weight:800;
}
.scale-buttons {
  display:flex;
  gap:12px;
  justify-content:center;
  padding:18px 18px 6px;
}
.scale-buttons button {
  border:0;
  min-width:82px;
  padding:12px 18px;
  border-radius:8px;
  background:rgba(5,55,70,.14);
  color:var(--teal-ink);
  font-weight:900;
  cursor:pointer;
}
.scale-buttons button.active { background:var(--mustard); }
.recipe-section {
  padding:10px 22px 22px;
}
.recipe-section h3 {
  margin:16px 0 9px;
  color:var(--rust);
  font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;
  letter-spacing:.16em;
  text-transform:uppercase;
  font-size:.88rem;
  display:flex;
  align-items:center;
  gap:12px;
}
.recipe-section h3::after {
  content:"";
  height:1px;
  flex:1;
  border-bottom:1px dashed rgba(180,68,34,.55);
}
.recipe-section li { margin:7px 0; line-height:1.35; }
.note {
  margin-top:16px;
  border-left:5px solid var(--mustard);
  border-radius:12px;
  background:rgba(220,161,15,.16);
  padding:12px 14px;
  color:var(--teal-ink);
}
.empty {
  margin:20px 0;
  padding:24px;
  border:2px dashed rgba(5,55,70,.25);
  border-radius:18px;
  background:rgba(255,243,212,.55);
  color:var(--muted);
}
.mobile-backdrop { display:none; }
@media (max-width:1100px) {
  .main { grid-template-columns:1fr; }
  .detail {
    position:fixed;
    inset:0;
    z-index:60;
    transform:translateX(105%);
    transition:.24s ease;
    padding:18px;
    background:rgba(245,228,195,.98);
  }
  body.detail-open .detail { transform:translateX(0); }
  .close-detail { display:inline-block; }
}
@media (min-width:1101px) {
  .close-detail { display:none; }
}
@media (max-width:820px) {
  .app { grid-template-columns:1fr; }
  .sidebar {
    position:fixed;
    z-index:80;
    inset:0 auto 0 0;
    width:295px;
    transform:translateX(-105%);
    transition:.24s ease;
  }
  body.menu-open .sidebar { transform:translateX(0); }
  .mobile-backdrop {
    display:block;
    position:fixed;
    inset:0;
    background:rgba(5,55,70,.35);
    z-index:70;
    opacity:0;
    pointer-events:none;
    transition:.2s ease;
  }
  body.menu-open .mobile-backdrop { opacity:1; pointer-events:auto; }
  .content { padding:0 15px 34px; border-right:0; }
  .topbar { grid-template-columns:auto 1fr; gap:8px; padding:14px 0 10px; }
  .menu-toggle { display:flex; }
  .tagline { font-size:.66rem; letter-spacing:.18em; justify-self:start; }
  .search-wrap { grid-column:1 / -1; }
  .hero-pot { display:none; }
  .wagon-wrap {
    position:relative;
    left:auto;
    bottom:auto;
    padding:0 0 20px;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }
  .quote { font-size:1.45rem; text-align:center; }
  .card-grid { grid-template-columns:repeat(auto-fill, minmax(155px,1fr)); padding-bottom:20px; }
  .thumb { height:104px; }
  .card-body h2 { font-size:1rem; min-height:48px; }
}
@media print {
  .sidebar,.topbar,.wagon-wrap,.scale-buttons,.heart,.fav-detail,.close-detail { display:none !important; }
  .app,.main { display:block; }
  .content { border:0; }
  .detail { position:static; height:auto; overflow:visible; }
  .recipe-card { break-inside:avoid; box-shadow:none; }
}
</style>
</head>
<body>
<div class="mobile-backdrop" onclick="document.body.classList.remove('menu-open')"></div>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <svg class="hat-svg" viewBox="0 0 220 132" role="img" aria-label="Illustrated grey ball cap">
        <defs><linearGradient id="hatGrad" x1="0" x2="1"><stop offset="0" stop-color="#d7d4c8"/><stop offset="1" stop-color="#eee7d7"/></linearGradient></defs>
        <path d="M40 88 C50 30,165 20,183 88 Z" fill="url(#hatGrad)" stroke="#053746" stroke-width="2"/>
        <path d="M44 88 C86 101,147 99,184 88" fill="none" stroke="#053746" stroke-width="2"/>
        <path d="M31 94 C82 101,154 99,208 89 C214 91,210 102,198 106 C142 121,74 117,22 105 C12 102,13 94,31 94Z" fill="#c9c2b2" stroke="#053746" stroke-width="2"/>
        <path d="M109 28 C104 44,103 68,106 91" fill="none" stroke="#8c887e" stroke-width="1.5"/>
        <path d="M75 36 C68 52,65 71,65 91" fill="none" stroke="#9a958a" stroke-width="1"/>
        <path d="M146 36 C153 52,156 71,156 91" fill="none" stroke="#9a958a" stroke-width="1"/>
        <circle cx="77" cy="48" r="3" fill="#9a958a"/><circle cx="143" cy="48" r="3" fill="#9a958a"/>
        <text x="110" y="77" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="25" fill="#141414" transform="rotate(-2 110 77)">DESCENDENTS</text>
      </svg>
      <h1 class="logo-title">kWen’s</h1>
      <div class="logo-sub">Cookbook</div>
      <small>Good food.<br>Made with love.</small>
    </div>
    <div class="nav-section">
      <button class="nav-item" onclick="setSpecial('home')">⌂ Home</button>
      <button class="nav-item" onclick="setSpecial('favorites')">♥ Favorites</button>
    </div>
    <div class="nav-label">Recipes</div>
    <div id="categoryMenu"></div>
    <div class="nav-section">
      <button class="nav-item" onclick="setSpecial('notes')">▤ Kitchen Notes</button>
      <button class="nav-item" onclick="setTagFilter('Freezer Friendly')">✳ Freezer Friendly</button>
    </div>
  </aside>
  <main class="main">
    <section class="content">
      <div class="topbar">
        <button class="menu-toggle" onclick="document.body.classList.add('menu-open')" aria-label="Open menu">☰</button>
        <div class="tagline">Simple ingredients. Honest recipes. Made to share.</div>
        <div class="search-wrap"><input id="search" class="searchbox" type="search" placeholder="Search recipes..." autocomplete="off"><span class="search-icon">⌕</span></div>
      </div>
      <section class="hero">
        <svg class="hero-pot" width="90" height="74" viewBox="0 0 120 100" aria-hidden="true">
          <path d="M30 38h60v38c0 8-7 14-15 14H45c-8 0-15-6-15-14V38Z" fill="#9fc7bd" stroke="#053746" stroke-width="4"/>
          <path d="M24 43h-12c-6 0-9 5-8 11 1 5 5 8 10 8h10" fill="none" stroke="#053746" stroke-width="4"/>
          <path d="M96 43h12c6 0 9 5 8 11-1 5-5 8-10 8H96" fill="none" stroke="#053746" stroke-width="4"/>
          <path d="M43 33c2-10 32-10 34 0" fill="none" stroke="#053746" stroke-width="4"/>
          <path d="M24 36h72" stroke="#053746" stroke-width="4" stroke-linecap="round"/>
        </svg>
        <h1 id="pageTitle">Main Dishes</h1>
        <p id="pageSubtitle">Hearty, comforting, and made to bring everyone to the table.</p>
      </section>
      <section id="grid" class="card-grid"></section>
      <div class="wagon-wrap" aria-hidden="true">
        <svg width="410" height="152" viewBox="0 0 540 200">
          <path d="M28 162 C84 170,404 170,500 154" fill="none" stroke="#0b4a57" stroke-width="2" opacity=".45"/>
          <path d="M80 112 L130 70 L370 65 L458 107 L496 139 L78 144 Z" fill="#ead2a4" stroke="#053746" stroke-width="3"/>
          <path d="M128 73 L160 45 L315 45 L368 65 Z" fill="#f0e0bd" stroke="#053746" stroke-width="3"/>
          <path d="M166 52 H224 V89 H140 Z" fill="#b8d2cd" stroke="#053746" stroke-width="2"/>
          <path d="M232 52 H303 L344 89 H232 Z" fill="#b8d2cd" stroke="#053746" stroke-width="2"/>
          <path d="M355 88 L429 112 L457 138 H360 Z" fill="#d7caa8" stroke="#053746" stroke-width="2"/>
          <path d="M87 112 H470 L496 139 H72 Z" fill="#b98639" stroke="#053746" stroke-width="3"/>
          <path d="M95 118 H455" stroke="#6b431e" stroke-width="8"/>
          <path d="M99 135 H486" stroke="#6b431e" stroke-width="5"/>
          <circle cx="154" cy="147" r="28" fill="#192f34" stroke="#053746" stroke-width="4"/>
          <circle cx="154" cy="147" r="13" fill="#ead2a4" stroke="#053746" stroke-width="3"/>
          <circle cx="408" cy="147" r="28" fill="#192f34" stroke="#053746" stroke-width="4"/>
          <circle cx="408" cy="147" r="13" fill="#ead2a4" stroke="#053746" stroke-width="3"/>
          <path d="M120 42 H319" stroke="#053746" stroke-width="4"/>
          <path d="M53 138 H82 M492 137 H515" stroke="#dca10f" stroke-width="5" stroke-linecap="round"/>
        </svg>
        <div class="quote">George Johnson<small>“don’t worry be happy”</small></div>
      </div>
    </section>
    <aside class="detail" id="detail">
      <div class="detail-card">
        <div class="detail-head">
          <h2 class="detail-title" id="detailTitle"></h2>
          <div>
            <button class="fav-detail" id="favDetail" aria-label="Favorite">♡</button>
            <button class="close-detail" onclick="document.body.classList.remove('detail-open')" aria-label="Close">×</button>
          </div>
        </div>
        <div class="detail-hero" id="detailIcon"></div>
        <div class="info-row">
          <div class="info">Serves<br><span id="detailServes">—</span></div>
          <div class="info">Type<br><span id="detailCategory">—</span></div>
          <div class="info">Prep<br><span>Kitchen</span></div>
        </div>
        <div class="tags" id="detailTags"></div>
        <div class="scale-buttons">
          <button class="active" onclick="setScale(1, this)">1x</button>
          <button onclick="setScale(2, this)">2x</button>
          <button onclick="setScale(3, this)">3x</button>
        </div>
        <div class="recipe-section">
          <h3>Ingredients</h3>
          <ul id="detailIngredients"></ul>
          <h3>Method</h3>
          <ol id="detailMethod"></ol>
          <div class="note" id="detailNote"></div>
        </div>
      </div>
    </aside>

g yolks or 1 1/2 cups whipped cream method", "1/2 cup sugar", "2 tbsp cocoa powder for dusting"], "method": ["Prepare coffee and let cool.", "Make mascarpone cream.", "Dip ladyfingers briefly in coffee.", "Layer ladyfingers and cream.", "Chill until set.", "Dust with cocoa before serving."], "note": "Best after a long chill so the layers settle together.", "tags": ["Family Favorite", "Sweet"]}];
let activeCategory = 'Main Dishes';
let activeTag = null;

function iconFor(r) {
  const t = (r.title + ' ' + r.category).toLowerCase();
  if (t.includes('pasta') || t.includes('ravioli') || t.includes('stroganoff') || r.category.toLowerCase().includes('pasta')) return iconPasta;
  if (t.includes('pie') || t.includes('tourti') || t.includes('cipâte')) return iconPie;
  if (['dessert','baking','macarons'].includes(r.category.toLowerCase())) return iconSweet;
  if (r.category.toLowerCase().includes('seafood') || t.includes('salmon') || t.includes('haddock')) return iconFish;
  return iconPot;
}
function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
function escapeAttr(str) { return escapeHtml(str).replace(/'/g, '&#039;'); }
function getFavorites() {
  try { return JSON.parse(localStorage.getItem('kwenCookbookFavorites') || '[]'); } catch { return []; }
}
function saveFavorites(favs) { localStorage.setItem('kwenCookbookFavorites', JSON.stringify(favs)); }
function isFav(title) { return getFavorites().includes(title); }
function toggleFav(title) {
  let favs = getFavorites();
  favs = favs.includes(title) ? favs.filter(x => x !== title) : [...favs, title];
  saveFavorites(favs);
  render();
  renderDetail(selectedIndex);
}
function cats() { return [...new Set(RECIPES.map(r => r.category))].sort(); }
function catIcon(cat) {
  const c = cat.toLowerCase();
  if (c.includes('pasta')) return '〰';
  if (c.includes('soup')) return '▰';
  if (c.includes('dessert') || c.includes('baking') || c.includes('macaron')) return '●';
  if (c.includes('seafood')) return '◌';
  return '▣';
}
function buildMenu() {
  const menu = document.getElementById('categoryMenu');
  menu.innerHTML = cats().map(cat => {
    const items = RECIPES.map((r,i)=>({...r,i}))
      .filter(r => r.category === cat)
      .sort((a,b)=>a.title.localeCompare(b.title))
      .map(r => `<button class="recipe-link ${r.i===selectedIndex?'active':''}" onclick="selectRecipe(${r.i})">${escapeHtml(r.title)}</button>`)
      .join('');
    return `<div class="cat ${cat===activeCategory?'open':''}">
      <button class="cat-head ${cat===activeCategory&&!activeSpecial&&!activeTag?'active':''}" onclick="setCategory('${escapeAttr(cat)}')">
        <span>${catIcon(cat)}</span><span>${escapeHtml(cat)}</span><span class="chev">›</span>
      </button>
      <div class="recipe-list">${items}</div>
    </div>`;
  }).join('');
}
function setCategory(cat) {
  activeCategory = cat; activeSpecial = null; activeTag = null;
  document.body.classList.remove('menu-open');
  render();
}
function setSpecial(special) {
  activeSpecial = special; activeTag = null;
  if (special === 'home') activeCategory = 'Main Dishes';
  document.body.classList.remove('menu-open');
  render();
}
function setTagFilter(tag) {
  activeTag = tag; activeSpecial = null;
  document.body.classList.remove('menu-open');
  render();
}
function filteredRecipes() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  let arr = RECIPES.map((r,i)=>({...r,i}));
  if (activeSpecial === 'favorites') arr = arr.filter(r => isFav(r.title));
  else if (activeTag) arr = arr.filter(r => (r.tags||[]).includes(activeTag));
  else arr = arr.filter(r => r.category === activeCategory);
  if (q) arr = arr.filter(r => [r.title,r.category,r.meta,r.note,...r.ingredients,...r.method,...(r.tags||[])].join(' ').toLowerCase().includes(q));
  return arr.sort((a,b)=>a.title.localeCompare(b.title));
}
function subtitleFor(cat) {
  const m = {
    'Main Dishes':'Hearty, comforting, and made to bring everyone to the table.',
    'Pasta':'Dough, noodles, sauces, and weekend projects worth the flour cloud.',
    'Soup':'Warm bowls, family pots, and cold-day classics.',
    'Seafood':'Simple fish recipes, buttery salmon, and coastal comfort.',
    'Dessert':'Sweet classics for coffee, company, and just one more piece.',
    'Baking':'Cozy bakes, loaves, and oven therapy.',
    'Macarons':'Tiny fancy chaos, standardized shells, and big payoff.'
  };
  return m[cat] || 'Family recipes, weeknight wins, and cozy kitchen favourites.';
}
function render() {
  buildMenu();
  const arr = filteredRecipes();
  const title = activeSpecial === 'favorites' ? 'Favorites' : activeTag || activeCategory;
  document.getElementById('pageTitle').textContent = title;
  document.getElementById('pageSubtitle').textContent =
    activeSpecial === 'favorites' ? 'Your saved kitchen hits, ready when you are.' :
    activeTag ? 'Prep-ahead recipes built for future-you.' :
    subtitleFor(title);
  const grid = document.getElementById('grid');
  if (!arr.length) {
    grid.innerHTML = `<div class="empty">No recipes found. The cookbook gremlins came up empty.</div>`;
    return;
  }
  if (!arr.some(r => r.i === selectedIndex)) selectedIndex = arr[0].i;
  grid.innerHTML = arr.map(r => `
    <article class="recipe-card ${r.i===selectedIndex?'active':''}" onclick="selectRecipe(${r.i})">
      <div class="thumb">${iconFor(r)}<button class="heart ${isFav(r.title)?'faved':''}" onclick="event.stopPropagation(); toggleFav('${escapeAttr(r.title)}')">${isFav(r.title)?'♥':'♡'}</button></div>
      <div class="card-body">
        <h2>${escapeHtml(r.title)}</h2>
        <div class="card-foot"><span>${catIcon(r.category)}</span><span>${escapeHtml(r.category)}</span></div>
      </div>
    </article>
  `).join('');
  renderDetail(selectedIndex);
}
function selectRecipe(i) {
  selectedIndex = i; currentScale = 1;
  document.body.classList.remove('menu-open');
  document.body.classList.add('detail-open');
  renderDetail(i);
  render();
}
function extractYield(meta) {
  const m = String(meta).match(/serves?\s*:?\s*([\d–\-]+)|yields?\s*:?\s*([^.;]+)/i);
  return m ? (m[1] || m[2]) : '—';
}
function renderDetail(i) {
  const r = RECIPES[i] || RECIPES[0];
  document.getElementById('detailTitle').textContent = r.title;
  document.getElementById('detailIcon').innerHTML = iconFor(r);
  document.getElementById('detailServes').textContent = extractYield(r.meta);
  document.getElementById('detailCategory').textContent = r.category;
  document.getElementById('favDetail').textContent = isFav(r.title) ? '♥' : '♡';
  document.getElementById('favDetail').onclick = () => toggleFav(r.title);
  document.getElementById('detailTags').innerHTML = (r.tags||[]).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('');
  document.querySelectorAll('.scale-buttons button').forEach(b => b.classList.toggle('active', b.textContent.trim().startsWith(currentScale + 'x')));
  document.getElementById('detailIngredients').innerHTML = r.ingredients.map(x => `<li>${scaleText(x, currentScale)}</li>`).join('');
  document.getElementById('detailMethod').innerHTML = r.method.map(x => `<li>${escapeHtml(x)}</li>`).join('');
  const note = r.note || r.meta || '';
  document.getElementById('detailNote').innerHTML = `<strong>kWen note:</strong> ${escapeHtml(note)}`;
}
function setScale(scale, btn) {
  currentScale = scale;
  btn.closest('.scale-buttons').querySelectorAll('button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderDetail(selectedIndex);
}
const fractionVals = {'1/4':.25,'1/3':1/3,'1/2':.5,'2/3':2/3,'3/4':.75};
function nice(n) {
  const whole = Math.floor(n);
  const frac = n - whole;
  const fracs = [[.25,'1/4'],[1/3,'1/3'],[.5,'1/2'],[2/3,'2/3'],[.75,'3/4']];
  for (const [v,s] of fracs) {
    if (Math.abs(frac - v) < .04) return whole ? whole + ' ' + s : s;
  }
  const rounded = Math.round(n*100)/100;
  return String(rounded).replace(/\.0$/,'');
}
function scaleText(text, factor) {
  if (factor === 1) return escapeHtml(text);
  if (/[°]/.test(text)) return escapeHtml(text);
  let s = escapeHtml(text);
  s = s.replace(/(\d+)\s+(1\/4|1\/3|1\/2|2\/3|3\/4)/g, (_,w,f)=> nice((parseFloat(w)+fractionVals[f])*factor));
  s = s.replace(/(?<![\w/])(1\/4|1\/3|1\/2|2\/3|3\/4)(?![\w/])/g, (_,f)=> nice(fractionVals[f]*factor));
  s = s.replace(/(?<![\w/])(\d+(?:\.\d+)?)(?![\w/])/g, (m,n)=> {
    const num = parseFloat(n);
    if (num > 2100) return m;
    return nice(num*factor);
  });
  return s;
}
document.getElementById('search').addEventListener('input', render);
render();
</script>
