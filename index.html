<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kWen’s Cookbook</title>
<style>
:root {
  --teal:#9fc7bd;
  --teal-dark:#0b4a57;
  --teal-ink:#053746;
  --cream:#f5e4c3;
  --paper:#fff3d4;
  --paper2:#f8e8c7;
  --rust:#b44422;
  --rust-dark:#8f321c;
  --mustard:#dca10f;
  --ink:#053746;
  --muted:#6d6658;
  --line:rgba(5,55,70,.22);
  --shadow:0 18px 38px rgba(24,32,26,.18);
}
* { box-sizing:border-box; }
body {
  margin:0;
  min-height:100vh;
  color:var(--ink);
  font-family: Georgia, "Times New Roman", serif;
  background:
    radial-gradient(circle at 20% 0%, rgba(220,161,15,.20), transparent 24rem),
    radial-gradient(circle at 80% 0%, rgba(159,199,189,.34), transparent 24rem),
    linear-gradient(180deg, #f2d9aa 0%, var(--cream) 38%, #ead0a4 100%);
}
body::before {
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.22;
  background-image:
    linear-gradient(rgba(5,55,70,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(5,55,70,.035) 1px, transparent 1px);
  background-size:34px 34px;
}
button, input { font:inherit; }
.app {
  min-height:100vh;
  display:grid;
  grid-template-columns:292px minmax(0,1fr);
}
.sidebar {
  position:sticky;
  top:0;
  height:100vh;
  overflow:auto;
  padding:24px 22px;
  background:linear-gradient(180deg, rgba(255,255,255,.12), transparent 36%), var(--teal);
  border-right:2px solid rgba(5,55,70,.24);
  box-shadow:8px 0 30px rgba(5,55,70,.08);
}
.brand {
  text-align:center;
  padding-bottom:18px;
  border-bottom:1px solid rgba(5,55,70,.28);
  margin-bottom:16px;
}
.logo-title {
  margin:0;
  color:var(--teal-dark);
  font-size:3rem;
  line-height:.9;
  letter-spacing:-.07em;
  font-weight:900;
}
.logo-sub {
  margin:10px 0 0;
  color:var(--rust);
  font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;
  font-size:.86rem;
  font-weight:800;
  letter-spacing:.42em;
  text-transform:uppercase;
}
.brand small {
  display:block;
  margin-top:12px;
  color:var(--teal-ink);
  font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;
  font-weight:800;
  letter-spacing:.16em;
  text-transform:uppercase;
}
.hat-svg { width:172px; max-width:100%; margin:0 auto 10px; display:block; }
.hat-img{width:190px;max-width:100%;display:block;margin:0 auto 12px;filter:drop-shadow(0 8px 8px rgba(5,55,70,.18));mix-blend-mode:multiply;}
.nav-section {
  border-bottom:1px solid rgba(5,55,70,.25);
  padding:8px 0 12px;
  margin-bottom:8px;
}
.nav-label {
  margin:10px 0 8px;
  color:var(--rust);
  font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;
  font-size:.74rem;
  font-weight:900;
  letter-spacing:.18em;
  text-transform:uppercase;
}
.nav-item,.cat-head,.recipe-link {
  width:100%;
  border:0;
  background:transparent;
  color:var(--teal-ink);
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 8px;
  border-radius:10px;
  cursor:pointer;
  text-align:left;
  font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;
  font-weight:850;
  letter-spacing:.07em;
  text-transform:uppercase;
  font-size:.86rem;
}
.nav-item:hover,.cat-head:hover,.recipe-link:hover { background:rgba(255,255,255,.22); }
.cat-head.active {
  background:var(--mustard);
  color:var(--teal-ink);
  box-shadow:inset 0 -2px rgba(120,79,0,.18);
}
.cat-head .chev { margin-left:auto; transition:transform .2s ease; }
.cat.open .chev { transform:rotate(90deg); }
.recipe-list { display:none; padding:2px 0 5px 28px; }
.cat.open .recipe-list { display:block; }
.recipe-link {
  text-transform:none;
  letter-spacing:0;
  font-family:Georgia,"Times New Roman",serif;
  font-weight:700;
  font-size:.92rem;
  padding:7px 8px;
  color:rgba(5,55,70,.88);
}
.recipe-link.active { color:var(--rust-dark); background:rgba(255,243,212,.48); }
.main {
  min-width:0;
  display:grid;
  grid-template-columns:minmax(0,1fr) 410px;
  min-height:100vh;
}
.content {
  padding:0 26px 34px;
  border-right:2px solid rgba(5,55,70,.14);
  position:relative;
}
.topbar {
  position:sticky;
  top:0;
  z-index:20;
  display:grid;
  grid-template-columns:auto 1fr minmax(220px,380px);
  align-items:center;
  gap:18px;
  padding:24px 0 16px;
  background:linear-gradient(to bottom, rgba(245,228,195,.98) 75%, rgba(245,228,195,0));
}
.menu-toggle {
  width:46px;
  height:46px;
  border:0;
  background:transparent;
  color:var(--rust);
  display:none;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
.tagline {
  justify-self:center;
  color:var(--teal-ink);
  font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;
  font-size:.86rem;
  font-weight:900;
  letter-spacing:.32em;
  text-transform:uppercase;
}
.search-wrap { position:relative; }
.searchbox {
  width:100%;
  border:2px solid rgba(5,55,70,.65);
  border-radius:999px;
  padding:13px 46px 13px 18px;
  background:rgba(255,243,212,.78);
  color:var(--ink);
  outline:none;
  font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;
}
.search-icon {
  position:absolute;
  right:16px;
  top:50%;
  transform:translateY(-50%);
  color:var(--rust);
  font-size:1.4rem;
}
.hero {
  position:relative;
  padding:26px 6px 10px;
  min-height:120px;
}
.hero h1 {
  margin:0;
  color:var(--rust);
  font-family:Impact, Haettenschweiler, "Arial Narrow Bold", ui-sans-serif, sans-serif;
  font-size:clamp(2.3rem,5vw,4.1rem);
  line-height:.95;
  letter-spacing:.08em;
  text-transform:uppercase;
  font-weight:900;
}
.hero p {
  max-width:500px;
  margin:10px 0 0;
  font-size:1.16rem;
  color:var(--teal-ink);
  font-weight:700;
}
.hero::after {
  content:"";
  display:block;
  width:min(360px,70%);
  border-bottom:2px dashed rgba(180,68,34,.55);
  margin-top:10px;
}
.hero-pot {
  position:absolute;
  right:18px;
  top:20px;
  opacity:.92;
}
.card-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(210px, 1fr));
  gap:16px;
  padding:12px 0 158px;
}
.recipe-card {
  border:1.8px solid rgba(5,55,70,.24);
  border-radius:14px;
  background:rgba(255,243,212,.78);
  overflow:hidden;
  box-shadow:0 10px 18px rgba(5,55,70,.10);
  cursor:pointer;
  transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
}
.recipe-card:hover {
  transform:translateY(-3px);
  box-shadow:0 16px 26px rgba(5,55,70,.16);
}
.recipe-card.active {
  border-color:var(--rust);
  box-shadow:0 0 0 3px rgba(180,68,34,.16), 0 16px 26px rgba(5,55,70,.15);
}
.thumb {
  height:126px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  border-bottom:1px solid rgba(5,55,70,.18);
  background:radial-gradient(circle at 25% 25%, rgba(255,255,255,.35), transparent 9rem), linear-gradient(135deg, rgba(220,161,15,.55), rgba(180,68,34,.35)), var(--paper);
}
.thumb svg { width:100%; height:100%; filter:drop-shadow(0 4px 6px rgba(0,0,0,.12)); }
.heart {
  position:absolute;
  top:8px;
  right:8px;
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  border:1px solid rgba(180,68,34,.34);
  border-radius:9px;
  background:rgba(255,243,212,.85);
  color:var(--rust);
  font-size:1.2rem;
}
.heart.faved { background:var(--rust); color:var(--paper); }
.card-body { padding:12px 14px 13px; }
.card-body h2 {
  min-height:52px;
  margin:0 0 10px;
  font-size:1.18rem;
  line-height:1.12;
  color:var(--teal-ink);
  text-align:center;
}
.card-foot {
  border-top:1px solid rgba(5,55,70,.18);
  padding-top:9px;
  display:flex;
  gap:8px;
  align-items:center;
  color:var(--teal-dark);
  font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;
  font-weight:900;
  letter-spacing:.08em;
  text-transform:uppercase;
  font-size:.72rem;
}
.wagon-img{width:500px;max-width:min(52vw,500px);height:auto;display:block;mix-blend-mode:multiply;filter:drop-shadow(0 7px 8px rgba(5,55,70,.14));}
.wagon-wrap {
  position:fixed;
  left:318px;
  bottom:18px;
  z-index:1;
  pointer-events:none;
  display:flex;
  align-items:flex-end;
  gap:24px;
  opacity:.95;
}
.quote {
  font-family:"Brush Script MT","Segoe Script",cursive;
  color:var(--teal-dark);
  font-size:1.9rem;
  line-height:1;
  text-shadow:0 1px rgba(255,255,255,.5);
}
.quote small {
  display:block;
  margin-top:8px;
  color:var(--rust);
  font-family:Georgia,"Times New Roman",serif;
  font-size:1rem;
}
.detail {
  position:sticky;
  top:0;
  height:100vh;
  overflow:auto;
  padding:30px 22px;
  background:rgba(255,243,212,.42);
}
.detail-card {
  background:rgba(255,243,212,.86);
  border:1.8px solid rgba(5,55,70,.22);
  border-radius:18px;
  overflow:hidden;
  box-shadow:var(--shadow);
}
.detail-head {
  background:linear-gradient(180deg, var(--rust), var(--rust-dark));
  color:var(--paper);
  padding:20px 22px;
  display:flex;
  gap:12px;
  justify-content:space-between;
}
.detail-title {
  margin:0;
  font-size:1.7rem;
  line-height:1.05;
}
.close-detail,.fav-detail {
  border:0;
  background:transparent;
  color:var(--paper);
  font-size:1.55rem;
  cursor:pointer;
}
.detail-hero {
  min-height:190px;
  display:grid;
  place-items:center;
  background:radial-gradient(circle at center, rgba(255,255,255,.25), transparent 8rem), linear-gradient(135deg, rgba(5,55,70,.24), rgba(220,161,15,.34)), var(--paper2);
  border-bottom:1px solid rgba(5,55,70,.16);
}
.detail-hero svg { width:100%; max-width:330px; height:190px; }
.info-row {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  border-bottom:1px solid rgba(5,55,70,.18);
}
.info {
  padding:14px 10px;
  text-align:center;
  border-right:1px solid rgba(5,55,70,.18);
  font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;
  font-weight:900;
  text-transform:uppercase;
  font-size:.74rem;
  letter-spacing:.08em;
}
.info:last-child { border-right:0; }
.tags {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  padding:14px 18px 0;
}
.tag {
  border:1px solid rgba(5,55,70,.22);
  background:rgba(159,199,189,.25);
  border-radius:999px;
  padding:5px 9px;
  font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;
  font-size:.75rem;
  font-weight:800;
}
.scale-buttons {
  display:flex;
  gap:12px;
  justify-content:center;
  padding:18px 18px 6px;
}
.scale-buttons button {
  border:0;
  min-width:82px;
  padding:12px 18px;
  border-radius:8px;
  background:rgba(5,55,70,.14);
  color:var(--teal-ink);
  font-weight:900;
  cursor:pointer;
}
.scale-buttons button.active { background:var(--mustard); }
.recipe-section {
  padding:10px 22px 22px;
}
.recipe-section h3 {
  margin:16px 0 9px;
  color:var(--rust);
  font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;
  letter-spacing:.16em;
  text-transform:uppercase;
  font-size:.88rem;
  display:flex;
  align-items:center;
  gap:12px;
}
.recipe-section h3::after {
  content:"";
  height:1px;
  flex:1;
  border-bottom:1px dashed rgba(180,68,34,.55);
}
.recipe-section li { margin:7px 0; line-height:1.35; }
.note {
  margin-top:16px;
  border-left:5px solid var(--mustard);
  border-radius:12px;
  background:rgba(220,161,15,.16);
  padding:12px 14px;
  color:var(--teal-ink);
}
.empty {
  margin:20px 0;
  padding:24px;
  border:2px dashed rgba(5,55,70,.25);
  border-radius:18px;
  background:rgba(255,243,212,.55);
  color:var(--muted);
}
.mobile-backdrop { display:none; }
@media (max-width:1100px) {
  .main { grid-template-columns:1fr; }
  .detail {
    position:fixed;
    inset:0;
    z-index:60;
    transform:translateX(105%);
    transition:.24s ease;
    padding:18px;
    background:rgba(245,228,195,.98);
  }
  body.detail-open .detail { transform:translateX(0); }
  .close-detail { display:inline-block; }
}
@media (min-width:1101px) {
  .close-detail { display:none; }
}
@media (max-width:820px) {
  .app { grid-template-columns:1fr; }
  .sidebar {
    position:fixed;
    z-index:80;
    inset:0 auto 0 0;
    width:295px;
    transform:translateX(-105%);
    transition:.24s ease;
  }
  body.menu-open .sidebar { transform:translateX(0); }
  .mobile-backdrop {
    display:block;
    position:fixed;
    inset:0;
    background:rgba(5,55,70,.35);
    z-index:70;
    opacity:0;
    pointer-events:none;
    transition:.2s ease;
  }
  body.menu-open .mobile-backdrop { opacity:1; pointer-events:auto; }
  .content { padding:0 15px 34px; border-right:0; }
  .topbar { grid-template-columns:auto 1fr; gap:8px; padding:14px 0 10px; }
  .menu-toggle { display:flex; }
  .tagline { font-size:.66rem; letter-spacing:.18em; justify-self:start; }
  .search-wrap { grid-column:1 / -1; }
  .hero-pot { display:none; }
  .wagon-wrap {
    position:relative;
    left:auto;
    bottom:auto;
    padding:0 0 20px;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }
  .quote { font-size:1.45rem; text-align:center; }
  .card-grid { grid-template-columns:repeat(auto-fill, minmax(155px,1fr)); padding-bottom:20px; }
  .thumb { height:104px; }
  .card-body h2 { font-size:1rem; min-height:48px; }
}
@media print {
  .sidebar,.topbar,.wagon-wrap,.scale-buttons,.heart,.fav-detail,.close-detail { display:none !important; }
  .app,.main { display:block; }
  .content { border:0; }
  .detail { position:static; height:auto; overflow:visible; }
  .recipe-card { break-inside:avoid; box-shadow:none; }
}
</style>
</head>

<script>
const RECIPES = [{"title": "Moist Banana Bread", "category": "Baking", "meta": "Basic, reliable loaf with sour cream or plain yogurt for moisture. Makes 1 loaf.", "ingredients": ["3 very ripe bananas, mashed", "1/2 cup butter, melted", "3/4 cup brown sugar", "2 large eggs", "1/3 cup sour cream or plain yogurt", "1 tsp vanilla extract", "1 1/2 cups all-purpose flour", "1 tsp baking soda", "1/2 tsp salt", "Optional: 1/2 tsp cinnamon", "Optional: 3/4 cup walnuts or chocolate chips"], "method": ["Preheat oven to 350°F / 175°C. Grease or line a standard loaf pan.", "Mash bananas in a large bowl, then stir in melted butter.", "Mix in brown sugar, eggs, sour cream or yogurt, and vanilla.", "Whisk flour, baking soda, salt, and cinnamon if using.", "Fold dry ingredients into wet ingredients just until combined. Do not overmix.", "Fold in walnuts or chocolate chips if using.", "Bake 55–65 minutes, until a toothpick comes out clean or with a few moist crumbs.", "Cool 10–15 minutes in the pan, then transfer to a rack before slicing."], "note": "Sour cream gives a richer loaf; yogurt gives a slightly tangier, lighter one.", "tags": ["Sweet"]}, {"title": "Egg-Heavy Ravioli Dough", "category": "Pasta", "meta": "Extra-rich yolk-forward dough for ravioli. Updated locked-in 250 g flour version.", "ingredients": ["250 g 00 flour", "2 whole eggs", "5 egg yolks", "1 tbsp olive oil", "Pinch of salt"], "method": ["Mound flour and make a deep well.", "Add whole eggs, yolks, olive oil, and salt.", "Beat eggs gently with a fork, gradually incorporating flour until a shaggy dough forms.", "Knead 8–10 minutes until smooth and elastic. It may feel firm at first.", "Wrap tightly and rest at least 1 hour at room temperature.", "Roll thin, around Marcato/Atlas setting 6–7, for ravioli."], "note": "If stiff, knead with lightly damp hands instead of adding water. If too soft, rest in the fridge briefly.", "tags": ["Freezer Friendly", "Pasta Project"]}, {"title": "Beef & Pork Ravioli Filling", "category": "Pasta", "meta": "Half-batch raw filling matched to one 250 g ravioli dough batch. Freezer-safe.", "ingredients": ["125 g ground beef", "125 g ground pork", "25 g parmesan, finely grated", "1/2 egg, beaten", "1 – 2 cloves garlic, about 5 g, minced", "1/2 tsp salt", "1/4 tsp black pepper", "Optional: pinch nutmeg or Italian seasoning", "Optional breadcrumbs only if mixture feels loose"], "method": ["Mix filling ingredients gently until evenly combined.", "Keep chilled while rolling pasta.", "Pipe or spoon small portions onto sheets.", "Seal ravioli well and cook from fresh or freeze in a single layer."], "note": "Official meat ravioli filling. Designed to match one batch of the 250 g flour ravioli dough and yield about 20–24 ravioli.", "tags": ["Freezer Friendly", "Pasta Project"]}, {"title": "Classic Ricotta–Spinach Ravioli Filling", "category": "Pasta", "meta": "Classic filling. Yields about 20–24 ravioli.", "ingredients": ["250 g ricotta", "80 – 100 g cooked spinach, well squeezed", "50 g parmesan", "1 egg yolk, about 18 g", "3 g garlic, finely grated or minced", "Pinch nutmeg", "Salt and pepper, to taste"], "method": ["Squeeze spinach very dry, then chop finely.", "Mix ricotta, spinach, parmesan, egg yolk, garlic, nutmeg, salt, and pepper.", "Taste and adjust seasoning.", "Pipe or spoon into ravioli sheets, then seal well."], "note": "A food processor is optional, but pulse lightly only. You want smooth-ish, not gluey.", "tags": ["Freezer Friendly", "Pasta Project", "Family Favorite"]}, {"title": "Beef Stroganoff with Striploin & No Yolks Noodles", "category": "Main Dishes", "meta": "Updated locked-in version with striploin, mushrooms, sour cream, and No Yolks noodles.", "ingredients": ["450 – 600 g striploin steak, sliced into strips", "Salt and pepper, to taste", "2 tbsp butter, divided", "1 tbsp oil", "225 g mushrooms, sliced", "1 small onion, sliced or diced", "2 cloves garlic, minced", "2 cups beef broth", "1 tbsp Dijon mustard", "1 tbsp Worcestershire sauce", "1 – 2 tbsp flour, as needed for thickening", "1/2 cup sour cream", "1 bag No Yolks noodles"], "method": ["Season steak strips with salt and pepper.", "Sear steak quickly in oil and a little butter until browned but not fully cooked through. Remove and reserve.", "Add remaining butter, mushrooms, and onion. Cook until softened and mushrooms release moisture.", "Add garlic and cook 30–60 seconds.", "Sprinkle in flour and stir to coat the vegetables.", "Add beef broth, Dijon, and Worcestershire. Simmer until the sauce coats a spoon and closes slowly when dragged through.", "Reduce heat or remove from heat briefly, then stir in sour cream so it does not split.", "Return steak and juices to the sauce just to finish warming through.", "Cook No Yolks noodles according to package directions and serve with stroganoff over top."], "note": "The sauce should be noticeably thicker before sour cream goes in. If it still looks watery, reduce 2–4 minutes more.", "tags": []}, {"title": "kWen’s Classic Chicken Stew", "category": "Soup", "meta": "Whole chicken stew with potatoes, optional carrots, herbes salées, rosemary, summer savory, and rolled dough boys.", "ingredients": ["1 whole chicken, about 4 – 5 lb / 1.8 – 2.3 kg", "10 – 12 cups water", "1 large onion, peeled and halved", "5 – 6 medium potatoes, peeled and cubed", "2 – 3 carrots, sliced, optional", "1 tbsp herbes salées", "1 tsp dried rosemary", "1 tbsp summer savory", "Salt and black pepper, to taste", "Dough boys: 2 cups / 250 g flour", "1 tsp salt", "2 tbsp olive oil", "About 3/4 cup / 180 ml water, enough for a soft dough"], "method": ["Place whole chicken in a large stockpot and cover with water. Add onion, rosemary, summer savory, and herbes salées.", "Bring to a gentle boil, then reduce heat and simmer 1 1/2–2 hours, skimming foam as needed, until chicken is tender.", "Remove chicken and cool slightly. Discard onion.", "Pull chicken from bones and return meat to the pot. Discard skin and bones.", "Add carrots and simmer 5–10 minutes.", "While carrots simmer, mix flour and salt for the dough. Add olive oil and enough water to form a smooth dough.", "Knead briefly, roll out on a lightly floured surface, and cut into small squares or rectangles.", "Add cubed potatoes to the stew.", "Shortly after adding potatoes, drop in the dough pieces.", "Simmer until potatoes are fork tender and dough is cooked through, about 10–15 minutes.", "Taste and adjust salt and pepper before serving."], "note": "No celery and no baking powder. The dough and cubed potatoes should finish cooking at roughly the same time.", "tags": ["Freezer Friendly", "Soup & Stew", "Family Favorite"]}, {"title": "kWen’s Cipâte", "category": "Main Dishes", "meta": "Long-cooked French Canadian layered meat pie with meatballs, cubed meats, potatoes, onions, broth, and rolled oil dough.", "ingredients": ["1 lb / 450 g small meatballs or ground beef, formed about 1 inch or smaller", "1 lb / 450 g cubed beef", "1 lb / 450 g cubed chicken", "1 lb / 450 g cubed veal or lamb", "5 – 6 medium potatoes, peeled and diced small", "2 large onions, sliced", "Salt and black pepper, liberally", "1 tbsp summer savory", "1 tbsp parsley", "Dough: 5 cups / 625 g flour", "2 tsp salt", "1/2 cup / 120 ml oil", "About 1 1/2 cups / 360 ml water, enough for a soft dough", "6 – 10 cups chicken broth, plus more as needed through cooking"], "method": ["Mix flour and salt for the dough. Add oil and enough water to form a smooth workable dough. Knead briefly and divide into portions.", "Season meats generously with salt, pepper, summer savory, and parsley.", "Roll dough portions into thin sheets for layering.", "In a large deep roasting pan or heavy Dutch oven, layer meat, potatoes, sliced onions, and a sheet of dough.", "Repeat the layers until the dish is full.", "Pour chicken broth over the layers until very well moistened but not overflowing.", "Cover tightly and cook hot for the first hour, around 400°F / 205°C.", "Turn oven off overnight and leave the cipâte inside.", "The next morning, turn oven very low, around 225–250°F / 110–120°C, and cook another 10–12 hours at a gentle simmer.", "Add chicken broth repeatedly through the day so it stays moist and never dries out."], "note": "The long cook is the heart of the recipe. Dough softens into tender layers and potatoes absorb the meat juices and broth.", "tags": ["Freezer Friendly", "Family Favorite"]}, {"title": "Braised Beef Pot Pie", "category": "Main Dishes", "meta": "Chuck or blade roast braised until tender in rich gravy, finished under flaky pie crust or puff pastry.", "ingredients": ["2 1/2 lb / 1.1 kg chuck roast, blade roast, or stewing beef, cut into chunks", "Salt and black pepper", "2 tbsp flour", "2 tbsp oil", "1 large onion, diced", "3 carrots, sliced", "225 g mushrooms, sliced", "4 cloves garlic, minced", "2 tbsp tomato paste", "2 cups beef broth", "1 cup red wine or extra broth", "1 tbsp Worcestershire sauce", "1 tsp thyme", "1 tsp rosemary", "1 bay leaf", "Pie dough or puff pastry for topping"], "method": ["Pat beef dry, season generously, and toss lightly with flour.", "Brown beef deeply in batches in a Dutch oven with oil. Remove and set aside.", "Cook onion, carrots, and mushrooms in the same pot until softened and mushrooms release moisture.", "Add garlic and tomato paste and cook 1–2 minutes.", "Deglaze with red wine or broth, scraping up browned bits.", "Return beef to the pot. Add beef broth, Worcestershire, thyme, rosemary, and bay leaf.", "Cover and braise at 325°F / 163°C for about 3 hours, until fork tender.", "Remove lid for the last 20–30 minutes if needed to thicken. Remove bay leaf.", "Cool filling slightly, transfer to a pie dish, and top with pie crust or puff pastry.", "Bake at 400°F / 205°C for 40–50 minutes, until golden and bubbling."], "note": "Freezer-friendly. Best frozen as filling, then topped with fresh pastry before baking.", "tags": ["Freezer Friendly"]}, {"title": "kWen’s Guinness Beef Stew with Irish function thumbFor(r) {
  const t = (r.title + ' ' + r.category + ' ' + r.meta).toLowerCase();
  let type = 'chickenStew';
  if (t.includes('guinness') || (t.includes('beef') && t.includes('mash'))) type = 'beef';
  else if (t.includes('stroganoff') || t.includes('no yolks')) type = 'noodles';
  else if (t.includes('ravioli')) type = 'ravioli';
  else if (t.includes('pot pie')) type = 'potPie';
  else if (t.includes('tourti') || t.includes('cipâte') || t.includes('sugar pie')) type = 'pieSlice';
  else if (t.includes('salmon')) type = 'salmon';
  else if (t.includes('haddock') || t.includes('fish') || t.includes('seafood')) type = 'fish';
  else if (t.includes('banana bread')) type = 'loaf';
  else if (t.includes('macaron')) type = 'macarons';
  else if (t.includes('tiramisu')) type = 'tiramisu';
  else if (t.includes('brownie') || t.includes('dessert')) type = 'dessert';
  return `<svg viewBox="0 0 240 150" aria-hidden="true">${foodScene(type)}</svg>`;
}
function iconFor(r) { return thumbFor(r); }

function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
function escapeAttr(str) { return escapeHtml(str).replace(/'/g, '&#039;'); }
function getFavorites() {
  try { return JSON.parse(localStorage.getItem('kwenCookbookFavorites') || '[]'); } catch { return []; }
}
function saveFavorites(favs) { localStorage.setItem('kwenCookbookFavorites', JSON.stringify(favs)); }
function isFav(title) { return getFavorites().includes(title); }
function toggleFav(title) {
  let favs = getFavorites();

}
function cats() { return [...new Set(RECIPES.map(r => r.category))].sort(); }
function catIcon(cat) {
  const c = cat.toLowerCase();
  if (c.includes('pasta')) return '〰';
  if (c.includes('soup')) return '▰';
  if (c.includes('dessert') || c.includes('baking') || c.includes('macaron')) return '●';
  if (c.includes('seafood')) return '◌';
  return '▣';
}
function buildMenu() {
  const menu = document.getElementById('categoryMenu');
  menu.innerHTML = cats().map(cat => {
    const items = RECIPES.map((r,i)=>({...r,i}))
      .filter(r => r.category === cat)
      .sort((a,b)=>a.title.localeCompare(b.title))
      .map(r => `<button class="recipe-link ${r.i===selectedIndex?'active':''}" onclick="selectRecipe(${r.i})">${escapeHtml(r.title)}</button>`)
      .join('');
    return `<div class="cat ${cat===activeCategory?'open':''}">
      <button class="cat-head ${cat===activeCategory&&!activeSpecial&&!activeTag?'active':''}" onclick="setCategory('${escapeAttr(cat)}')">
        <span>${catIcon(cat)}</span><span>${escapeHtml(cat)}</span><span class="chev">›</span>
      </button>
      <div class="recipe-list">${items}</div>
    </div>`;
  }).join('');
}
function setCategory(cat) {
  activeCategory = cat; activeSpecial = null; activeTag = null;
  document.body.classList.remove('menu-open');
  render();
}
function setSpecial(special) {
  activeSpecial = special; activeTag = null;
  if (special === 'home') activeCategory = 'Main Dishes';
  document.body.classList.remove('menu-open');
  render();
}
function setTagFilter(tag) {
  activeTag = tag; activeSpecial = null;
  document.body.classList.remove('menu-open');
  render();
}
function filteredRecipes() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  let arr = RECIPES.map((r,i)=>({...r,i}));
  if (activeSpecial === 'favorites') arr = arr.filter(r => isFav(r.title));
  else if (activeTag) arr = arr.filter(r => (r.tags||[]).includes(activeTag));
  else arr = arr.filter(r => r.category === activeCategory);
  if (q) arr = arr.filter(r => [r.title,r.category,r.meta,r.note,...r.ingredients,...r.method,...(r.tags||[])].join(' ').toLowerCase().includes(q));
  return arr.sort((a,b)=>a.title.localeCompare(b.title));
}
function subtitleFor(cat) {

    'Main Dishes':'Hearty, comforting, and made to bring everyone to the table.',
    'Pasta':'Dough, noodles, sauces, and weekend projects worth the flour cloud.',
    'Soup':'Warm bowls, family pots, and cold-day classics.',

      <div class="card-body">
        <h2>${escapeHtml(r.title)}</h2>
        <div class="card-foot"><span>${catIcon(r.category)}</span><span>${escapeHtml(r.category)}</span></div>
      </div>
    </article>
  `).join('');
  renderDetail(selectedIndex);
}
function selectRecipe(i) {
  selectedIndex = i; currentScale = 1;
  document.body.classList.remove('menu-open');
  document.body.classList.add('detail-open');
  renderDetail(i);
  render();
}
function extractYield(meta) {
  const m = String(meta).match(/serves?\s*:?\s*([\d–\-]+)|yields?\s*:?\s*([^.;]+)/i);
  return m ? (m[1] || m[2]) : '—';
}
function renderDetail(i) {
  const r = RECIPES[i] || RECIPES[0];
  document.getElementById('detailTitle').textContent = r.title;
  document.getElementById('detailIcon').innerHTML = iconFor(r);
  document.getElementById('detailServes').textContent = extractYield(r.meta);
  document.getElementById('detailCategory').textContent = r.category;
  document.getElementById('favDetail').textContent = isFav(r.title) ? '♥' : '♡';
  document.getElementById('favDetail').onclick = () => toggleFav(r.title);
  document.getElementById('detailTags').innerHTML = (r.tags||[]).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('');
  document.querySelectorAll('.scale-buttons button').forEach(b => b.classList.toggle('active', b.textContent.trim().startsWith(currentScale + 'x')));
  document.getElementById('detailIngredients').innerHTML = r.ingredients.map(x => `<li>${scaleText(x, currentScale)}</li>`).join('');
  document.getElementById('detailMethod').innerHTML = r.method.map(x => `<li>${escapeHtml(x)}</li>`).join('');
  const note = r.note || r.meta || '';
  document.getElementById('detailNote').innerHTML = `<strong>kWen note:</strong> ${escapeHtml(note)}`;
}
function setScale(scale, btn) {
  currentScale = scale;
  btn.closest('.scale-buttons').querySelectorAll('button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderDetail(selectedIndex);
}
const fractionVals = {'1/4':.25,'1/3':1/3,'1/2':.5,'2/3':2/3,'3/4':.75};
function nice(n) {
  const whole = Math.floor(n);
  const frac = n - whole;
  const fracs = [[.25,'1/4'],[1/3,'1/3'],[.5,'1/2'],[2/3,'2/3'],[.75,'3/4']];
  for (const [v,s] of fracs) {
    if (Math.abs(frac - v) < .04) return whole ? whole + ' ' + s : s;
  }
  const rounded = Math.round(n*100)/100;
  return String(rounded).replace(/\.0$/,'');
}
function scaleText(text, factor) {
  if (factor === 1) return escapeHtml(text);
  if (/[°]/.test(text)) return escapeHtml(text);
  let s = escapeHtml(text);
  s = s.replace(/(\d+)\s+(1\/4|1\/3|1\/2|2\/3|3\/4)/g, (_,w,f)=> nice((parseFloat(w)+fractionVals[f])*factor));
  s = s.replace(/(?<![\w/])(1\/4|1\/3|1\/2|2\/3|3\/4)(?![\w/])/g, (_,f)=> nice(fractionVals[f]*factor));
  s = s.replace(/(?<![\w/])(\d+(?:\.\d+)?)(?![\w/])/g, (m,n)=> {
    const num = parseFloat(n);
    if (num > 2100) return m;
    return nice(num*factor);
  });
  return s;
}
document.getElementById('search').addEventListener('input', render);
render();
</script>
